<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heaven Architects</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; padding:40px 20px; }
  #youtube-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .yt-box { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  .yt-box iframe { width:100%; height:100%; border:0; }
  .yt-title { font-size:14px; margin:8px 0 0 0; font-weight:bold; }
  @media (max-width:768px) { #youtube-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="youtube-row">Loading latest videos...</div>

<script>
const channelId = "UCpnU9f5UwOw8Jfa9iEKlqBQ";
const rssUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

// This works on GitHub Pages because origin is https://, not null
const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

fetch(apiUrl)
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("youtube-row");
    const videos = data.items.slice(0, 3);
    
    container.innerHTML = videos.map(v => {
      const videoId = v.link.split("v=")[1];
      return `
        <div>
          <div class="yt-box">
            <iframe src="https://www.youtube.com/embed/${videoId}?rel=0" 
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen loading="lazy"></iframe>
          </div>
          <p class="yt-title">${v.title}</p>
        </div>`;
    }).join("");
  })
  .catch(err => {
    document.getElementById("youtube-row").innerText = "Could not load videos.";
    console.error(err);
  });
</script>

</body>
</html>
