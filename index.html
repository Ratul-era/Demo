<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heaven Architects</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; padding:40px 20px; }
  #youtube-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
  .yt-box { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  .yt-box iframe { width:100%; height:100%; border:0; }
  @media (max-width:768px) { #youtube-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="youtube-row">Loading latest videos...</div>

<script>
const channelId = "UCpnU9f5UwOw8Jfa9iEKlqBQ";

async function loadLatest() {
  try {
    // Free YouTube API with CORS - works on GitHub Pages
    const url = `https://yt.lemnoslife.com/noKey/search?channelId=${channelId}&part=snippet&order=date&type=video`;
    const res = await fetch(url);
    const data = await res.json();
    
    const videos = data.items.slice(0, 3);
    
    document.getElementById("youtube-row").innerHTML = videos.map(v => {
      const videoId = v.id.videoId;
      return `
        <div class="yt-box">
          <iframe src="https://www.youtube.com/embed/${videoId}?rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen loading="lazy"></iframe>
        </div>`;
    }).join("");
    
  } catch (e) {
    console.error(e);
    document.getElementById("youtube-row").innerHTML = `
      <p>Auto-fetch blocked. Trying fallback...</p>
      <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ&index=1" allowfullscreen></iframe></div>
      <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ&index=2" allowfullscreen></iframe></div>
      <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ&index=3" allowfullscreen></iframe></div>
    `;
  }
}

loadLatest();
</script>

</body>
</html>
