<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heaven Architects</title>
<style>
  body { margin:0; font-family: Arial, sans-serif; padding:40px 20px; }
  #youtube-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1200px; margin: 0 auto; }
  .yt-box { background:#000; border-radius:12px; overflow:hidden; aspect-ratio:16/9; }
  .yt-box iframe { width:100%; height:100%; border:0; }
  @media (max-width:768px) { #youtube-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div id="youtube-row">Loading latest videos...</div>

<script>
const channelId = "UCpnU9f5UwOw8Jfa9iEKlqBQ";
const feedUrl = `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

async function getVideos() {
  // Try AllOrigins (most stable for GitHub Pages)
  try {
    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}`);
    const data = await res.json();
    const xml = data.contents;
    
    // Parse XML
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(xml, "text/xml");
    const entries = xmlDoc.querySelectorAll("entry");
    
    return Array.from(entries).slice(0,3).map(entry => {
      const link = entry.querySelector("link").getAttribute("href");
      const videoId = link.split("v=")[1];
      const title = entry.querySelector("title").textContent;
      return { videoId, title };
    });
  } catch(e) {
    console.error("AllOrigins failed", e);
    throw e;
  }
}

getVideos().then(videos => {
  const container = document.getElementById("youtube-row");
  container.innerHTML = videos.map(v => `
    <div class="yt-box">
      <iframe src="https://www.youtube.com/embed/${v.videoId}?rel=0" 
        title="${v.title}"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen loading="lazy"></iframe>
    </div>
  `).join("");
}).catch(() => {
  document.getElementById("youtube-row").innerHTML = "Could not load automatically. Using fallback.";
  // Fallback - shows playlist, at least it plays
  document.getElementById("youtube-row").innerHTML = `
    <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ" allowfullscreen></iframe></div>
    <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ" allowfullscreen></iframe></div>
    <div class="yt-box"><iframe src="https://www.youtube.com/embed/videoseries?list=UUpnU9f5UwOw8Jfa9iEKlqBQ" allowfullscreen></iframe></div>
  `;
});
</script>

</body>
</html>
